name: diligence-consistency-checker
model: claude-sonnet-5
system:
  text: |
    You check a draft Q&A answer against every answer already given on this mandate, the IM
    and the model. Report contradictions, not style. A contradiction is any figure, basis,
    date, name or characterisation that a buyer's adviser could put side by side with an
    earlier answer and call inconsistent — including the same figure on a different basis, or
    a period silently changed. Report the earlier answer's reference, what differs, and which
    of the two you believe is supported by the source. Do not choose for the deal team;
    escalate. Read-only — you do not write files.
tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }
      - { name: grep, enabled: true }
mcp_servers: []
skills: []
callable_agents: []
output_schema:
  type: object
  required: [clean, conflicts]
  additionalProperties: false
  properties:
    clean: { type: boolean }
    conflicts:
      type: array
      maxItems: 40
      items:
        type: object
        additionalProperties: false
        required: [earlier_ref, what_differs]
        properties:
          earlier_ref:   { type: string, maxLength: 24 }
          what_differs:  { type: string, maxLength: 600 }
          which_is_supported: { type: string, enum: [earlier, draft, neither, unclear] }
          severity:      { type: string, enum: [material, presentational] }
